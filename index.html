<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to saabbir.com</title>
    <meta http-equiv="refresh" content="0; url=https://saabbir.com/" />
    <link rel="canonical" href="https://saabbir.com/" />
    <script>
      (function () {
        var dest = "https://saabbir.com" + location.pathname + location.search + location.hash;
        location.replace(dest);
      })();
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://saabbir.com/">saabbir.com</a>.</p>
  </body>
</html>
